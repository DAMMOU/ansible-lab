---
- name: Configuration de base de tous les serveurs
  hosts: all
  become: yes
  roles:
    - common

  # C'est ici que la section tasks doit commencer
  tasks:
    - name: Afficher le fuseau horaire
      debug:
        msg: "Le fuseau horaire est {{ timezone }}"

- name: Déploiement de Nginx sur le serveur web
  hosts: node1
  become: yes
  roles:
    - nginx
